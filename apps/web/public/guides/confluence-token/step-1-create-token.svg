    <text x="18" y="254">Approvals</text><text x="18" y="284">Editor</text><text x="18" y="314">Email</text><text x="18" y="344">Password</text>
    <text x="18" y="380">Table Filter, Charts &amp;</text><text x="18" y="398">Spreadsheets</text>
    <text x="18" y="433" font-size="11" font-weight="700">TOKENS</text>
    <text x="18" y="466">Authorized applications</text><text x="18" y="500" fill="#0c66e4">Personal Access Tokens</text><text x="18" y="534">Two-step verification</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="246" y="232" font-size="17" font-weight="700">Personal Access Tokens</text>
    <text x="246" y="266" font-size="14">Use personal access tokens as a safe alternative to authenticating with username and password.</text>
  </g>
  <rect x="1390" y="216" width="166" height="44" rx="4" fill="#0c66e4"/>
  <text x="1473" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Create token</text>
