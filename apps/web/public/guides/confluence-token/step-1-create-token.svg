  </g>
  <line x1="246" y1="392" x2="1560" y2="392" stroke="#dfe1e6"/>
  <path d="M1374 202 C1432 192 1518 196 1572 207 L1578 269 C1515 279 1423 278 1374 266 Z" fill="none" stroke="#e32227" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
