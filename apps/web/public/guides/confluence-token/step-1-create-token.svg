<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Bước 1: mở trang Personal Access Tokens</title>
  <desc id="desc">Ảnh hướng dẫn trang cài đặt Confluence, nút Create token ở góc phải được khoanh đỏ.</desc>
  <rect width="1600" height="720" fill="#fff"/>
  <rect width="1600" height="54" fill="#f7f8f9" stroke="#dfe1e6"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="22" y="34" font-size="20" font-weight="700">▦</text>
    <text x="66" y="34" font-size="15" font-weight="700">VNPAY</text>
    <text x="142" y="34" font-size="15">Spaces⌄</text>
    <text x="235" y="34" font-size="15">Approvals</text>
    <text x="326" y="34" font-size="15">Calendars</text>
    <text x="417" y="34" font-size="15">Analytics</text>
  </g>
  <rect x="510" y="12" width="74" height="32" rx="3" fill="#0c66e4"/>
  <text x="547" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Create</text>
  <circle cx="40" cy="91" r="23" fill="#0c66e4"/>
  <text x="74" y="88" font-family="Arial, sans-serif" font-size="13" fill="#0c66e4">People</text>
  <text x="74" y="119" font-family="Arial, sans-serif" font-size="28" fill="#172b4d">Anh, Nguyễn Đức</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#344563">
    <text x="18" y="171">Profile</text><text x="76" y="171">Approvals</text><text x="147" y="171">Tasks</text><text x="205" y="171">Saved for later</text><text x="310" y="171">Watches</text><text x="378" y="171">Drafts</text><text x="435" y="171">Network</text><text x="503" y="171" fill="#0c66e4">Settings</text>
  </g>
  <line x1="0" y1="186" x2="1600" y2="186" stroke="#dfe1e6"/>
  <rect x="0" y="187" width="220" height="475" fill="#fafbfc" stroke="#dfe1e6"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#344563">
