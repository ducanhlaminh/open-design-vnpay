<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Bước 2: nhập tên và tạo token</title>
  <desc id="desc">Ảnh hướng dẫn form tạo token, ô Token Name và tùy chọn Automatic expiry được đánh dấu đỏ.</desc>
  <rect width="1600" height="800" fill="#fff"/>
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="34" fill="#344563">×</text>
  <g transform="translate(535 24)" font-family="Arial, sans-serif" fill="#172b4d">
    <text x="0" y="24" font-size="22" font-weight="700">Create a personal access token</text>
    <text x="0" y="53" font-size="14">Use personal access tokens as a safe alternative to authenticating with username and</text>
    <text x="0" y="75" font-size="14">password.</text>
    <rect x="0" y="88" width="550" height="72" rx="3" fill="#deebff"/>
    <circle cx="28" cy="113" r="10" fill="#0c66e4"/>
    <text x="28" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">i</text>
    <text x="54" y="118" font-size="14">Personal access tokens are as important as passwords and should be equally</text>
    <text x="54" y="139" font-size="14">protected.</text>
    <text x="0" y="199" font-size="13">Token Name *</text>
    <rect x="0" y="207" width="550" height="42" rx="3" fill="#fff" stroke="#0c66e4" stroke-width="2"/>
    <text x="11" y="234" font-size="15">Open Design</text>
    <text x="0" y="270" font-size="12" fill="#6b778c">Number of characters remaining: 29</text>
    <text x="0" y="316" font-size="20" font-weight="700">Permissions</text>
    <text x="0" y="345" font-size="14">Permission level of personal access tokens is set to the level of access you currently have.</text>
    <text x="0" y="395" font-size="20" font-weight="700">Expiry date</text>
    <text x="0" y="423" font-size="14">For security reasons, you can set this token to automatically expire.</text>
    <rect x="6" y="450" width="14" height="14" rx="2" fill="#fff" stroke="#6b778c" stroke-width="2"/>
    <text x="30" y="463" font-size="14">Automatic expiry</text>
    <text x="0" y="495" font-size="13">Days until expiry</text>
    <rect x="0" y="505" width="82" height="40" rx="3" fill="#f4f5f7" stroke="#dfe1e6"/>
    <text x="13" y="530" font-size="14" fill="#a5adba">90</text>
    <text x="0" y="566" font-size="12" fill="#6b778c">The token will never expire.</text>
    <rect x="0" y="595" width="72" height="38" rx="3" fill="#0c66e4"/>
    <text x="36" y="619" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Create</text>
    <text x="88" y="619" font-size="14">Cancel</text>
    <path d="M-8 184 C-17 207 -14 243 -4 260" fill="none" stroke="#e32227" stroke-width="7" stroke-linecap="round"/>
    <path d="M-7 440 C-16 448 -15 465 -8 472" fill="none" stroke="#e32227" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
