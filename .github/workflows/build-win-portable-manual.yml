name: build-win-portable-manual

# Manual, unsigned Windows portable-zip build for the ducanhlaminh fork.
# release-stable.yml is upstream nexu-io/open-design's pipeline (gated by
# `if: github.repository == 'nexu-io/open-design'`, requires Apple/R2 secrets
# this fork doesn't have) — this is a standalone, minimal equivalent for just
# the Windows leg, triggered by hand, no code-signing (forceCodeSigning=false
# already, matching how this fork's mac DMGs are also unsigned).

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version to build (matches apps/packaged/package.json unless overridden)"
        required: true
        default: "0.8.1"

jobs:
  build_win:
    name: Build Windows portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # postinstall.mjs builds packages/* and tools/* but not apps/* — mirrors
      # the explicit build steps release-stable.yml's `verify` job documents.
      - name: Build daemon
        run: pnpm --filter @open-design/daemon build

      - name: Build desktop
        run: pnpm --filter @open-design/desktop build

      - name: Build web
        run: |
          pnpm --filter @open-design/web build
          pnpm --filter @open-design/web build:sidecar

      - name: Setup NSIS (not used by --to zip, but tools-pack may probe for it)
        shell: pwsh
        run: |
          if ((Get-Command makensis.exe -ErrorAction SilentlyContinue) -or (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            exit 0
          }
          choco install nsis -y --no-progress

      - name: Build windows portable zip
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolsPackDir = "${{ runner.temp }}/tools-pack"
          $buildOutput = pnpm exec tools-pack win build `
            --dir $toolsPackDir `
            --namespace default `
            --portable `
            --app-version "${{ inputs.app_version }}" `
            --to zip `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "tools-pack win build exited with code $LASTEXITCODE"
          }
          $buildOutput | Set-Content -Path "${{ runner.temp }}/win-build.json"
          $buildOutput

      - name: Locate zip artifact
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "${{ runner.temp }}/tools-pack" -Recurse -Filter "*.zip" | Select-Object -First 1
          if ($null -eq $zip) {
            throw "no .zip artifact found under ${{ runner.temp }}/tools-pack"
          }
          "zip_path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=open-design-${{ inputs.app_version }}-win-x64-portable.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Rename artifact
        shell: pwsh
        run: |
          Copy-Item -Path "${{ steps.locate.outputs.zip_path }}" -Destination "${{ runner.temp }}/${{ steps.locate.outputs.zip_name }}"

      - name: Upload windows portable zip
        uses: actions/upload-artifact@v7
        with:
          name: win-portable-zip
          path: ${{ runner.temp }}/${{ steps.locate.outputs.zip_name }}
          retention-days: 3
