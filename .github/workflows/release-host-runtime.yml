name: release-host-runtime

# WP6 — builds the host runtime tarball (daemon + static web export, no
# Docker, no Electron) for darwin-arm64 / darwin-x64 / linux-x64 and
# publishes it as a GitHub Release, together with a merged release.json
# manifest that deploy/host/install.sh reads by default when no --archive /
# --release-url is given.
#
# This workflow never touches apps/desktop, apps/packaged, or tools/pack's
# (removed) Electron packaging surface; it only calls
# scripts/host-runtime/build-runtime.sh.
#
# darwin-arm64 and darwin-x64 each build NATIVELY on a real Apple Silicon /
# real Intel runner rather than cross-compiling, since better-sqlite3
# (native) and fsevents (darwin) are architecture-specific.

on:
  push:
    tags: ["v*"]
    # `preview` gets a continuous host-runtime build+publish on every push —
    # a rolling dev/beta channel distinct from the versioned `v*` tag
    # releases below. Both triggers resolve the release tag the same way
    # (see the "Resolve release tag" step): a tag push publishes under that
    # tag name; a branch push publishes/updates the
    # `host-runtime-v<package.json version>` release, so repeated preview
    # pushes without a version bump overwrite the same release rather than
    # accumulating one per push.
    branches: [preview]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build from (blank = the ref that triggered this run)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-host-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: darwin-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve version
        id: version
        # Explicit `shell: bash` -- GitHub's default shell for `run:` steps
        # on Windows runners is pwsh, which does not understand `set -euo
        # pipefail`. windows-latest ships Git Bash, so this is a no-op on
        # macos/ubuntu (already the default there) and the fix on Windows.
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version"

      - name: Build host runtime tarball
        shell: bash
        # These secrets, when set, get bundled into the tarball as
        # host-env.template (see build-runtime.sh) so a fresh install of
        # THIS repo's releases needs zero config flags for KG sync/Google
        # login. Deliberate for this repo despite being public -- see the
        # comment in build-runtime.sh before copying this pattern elsewhere.
        env:
          MEDIA_URL: ${{ secrets.OD_MEDIA_URL }}
          MEDIA_APP_ID: ${{ secrets.OD_MEDIA_APP_ID }}
          MEDIA_USER_ID: ${{ secrets.OD_MEDIA_USER_ID }}
          MEDIA_USER_ROLE: ${{ secrets.OD_MEDIA_USER_ROLE }}
          IDENTITY_URL: ${{ secrets.OD_IDENTITY_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.OD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OD_GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.OD_SESSION_SECRET }}
        run: |
          set -euo pipefail
          bash scripts/host-runtime/build-runtime.sh \
            --platform "${{ matrix.platform }}" \
            --version "${{ steps.version.outputs.version }}" \
            --out-dir "${{ runner.temp }}/out"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: host-runtime-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  smoke-test-windows:
    name: Smoke test install.ps1
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The no-download CDN one-liner (`irm <url> | iex`, or
      # `[scriptblock]::Create((irm <url>))` to pass flags) is the primary
      # documented way to run this installer, and it decodes the HTTP body
      # straight to a .NET string via Invoke-RestMethod -- a fundamentally
      # different code path than reading the file from disk (which every
      # other step below exercises via -Archive). A file-only smoke test
      # already missed one real regression here (a UTF-8 BOM that fixed the
      # file-read path but broke this one, since Invoke-RestMethod doesn't
      # strip a leading BOM and it silences the parser's ability to
      # recognize the opening `<#` block comment). This step fetches the
      # script by raw commit SHA -- the exact bytes a real user's `irm`
      # would get for this commit -- and proves it still parses AND
      # executes via [scriptblock]::Create, independent of the tarball
      # steps below.
      - name: Smoke test install.ps1 via irm | iex (no local download)
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $rawUrl = "https://raw.githubusercontent.com/${{ github.repository }}/$sha/deploy/host/install.ps1"
          $scriptText = Invoke-RestMethod -Uri $rawUrl -TimeoutSec 15
          $sb = [scriptblock]::Create($scriptText)
          & $sb -Help
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Help (via scriptblock, no local file) exited $LASTEXITCODE" }
          Write-Host "[ok] install.ps1 fetched via irm and executed via [scriptblock]::Create without a parse error"

      - name: Download win32-x64 tarball
        uses: actions/download-artifact@v8
        with:
          name: host-runtime-win32-x64
          path: ${{ runner.temp }}\out

      - name: Resolve archive path
        id: archive
        shell: pwsh
        run: |
          $tarball = Get-ChildItem -Path "${{ runner.temp }}\out" -Filter *.tar.gz | Select-Object -First 1
          if (-not $tarball) { Write-Error "no .tar.gz found in ${{ runner.temp }}\out"; exit 1 }
          "path=$($tarball.FullName)" >> $env:GITHUB_OUTPUT

      # Full install: no -NoStart, so this actually starts the daemon and
      # runs install.ps1's own health-check/rollback loop -- catches
      # startup-time breakage (e.g. a missing runtime dep in the packaged
      # node_modules) that a -NoStart-only smoke test would silently miss.
      # install.ps1 itself exits 1 if the health check fails (Invoke-Rollback
      # -> "No previous release to roll back to" on a fresh install), so a
      # broken daemon fails this step directly.
      # Verification runs in THIS SAME step, right after install.ps1 --
      # not a separate step. The Windows runner tears down (kills) every
      # process spawned during a step once that step ends, so a daemon
      # started here would already be dead by the start of a later step --
      # that's a runner artifact, not something that happens on a real
      # machine, but it means the liveness/health assertions below have to
      # run before this step's process job object gets torn down.
      - name: Run install.ps1 -Archive <local> + verify daemon health
        shell: pwsh
        run: |
          & "${{ github.workspace }}\deploy\host\install.ps1" -Archive "${{ steps.archive.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }

          $odHome = Join-Path $env:USERPROFILE ".open-design"
          $current = Join-Path $odHome "current"
          $configEnv = Join-Path $odHome "config.env"
          $pidFile = Join-Path $odHome "open-design.pid"

          if (-not (Test-Path $current)) { throw "missing $current" }
          $item = Get-Item $current
          if ($item.LinkType -ne "Junction") { throw "$current is not a Junction (LinkType: $($item.LinkType))" }

          if (-not (Test-Path $configEnv)) { throw "missing $configEnv" }

          $task = Get-ScheduledTask -TaskName "OpenDesignDaemon" -ErrorAction SilentlyContinue
          if (-not $task) { throw "OpenDesignDaemon scheduled task was not registered" }

          if (-not (Test-Path $pidFile)) { throw "missing $pidFile -- daemon never recorded a pid, so install.ps1's own health check could not have passed" }
          $daemonPid = (Get-Content $pidFile -Raw).Trim()
          $proc = Get-Process -Id $daemonPid -ErrorAction SilentlyContinue
          if (-not $proc) { throw "daemon process (pid $daemonPid) is not running" }

          $health = Invoke-RestMethod -Uri "http://127.0.0.1:7456/api/health" -TimeoutSec 5

          # Regression check for the config.env-never-reaches-the-Windows-
          # process bug (fixed by apps/daemon/src/load-host-config-env.ts):
          # SKILLS_DIR only resolves correctly when OD_RESOURCE_ROOT from
          # config.env actually made it into the daemon's process.env --
          # otherwise it silently falls back to a path that doesn't exist in
          # a released tarball and /api/skills comes back empty. A bare
          # /api/health 200 can't catch that; this can.
          $skills = Invoke-RestMethod -Uri "http://127.0.0.1:7456/api/skills" -TimeoutSec 5
          if (-not $skills.skills -or $skills.skills.Count -eq 0) { throw "/api/skills returned 0 skills -- OD_RESOURCE_ROOT (from config.env) did not reach the daemon process" }

          Write-Host "[ok] current is a Junction -> $($item.Target)"
          Write-Host "[ok] config.env present"
          Write-Host "[ok] OpenDesignDaemon scheduled task registered (state: $($task.State))"
          Write-Host "[ok] daemon process running (pid $daemonPid)"
          Write-Host "[ok] /api/health responded: $($health | ConvertTo-Json -Compress)"
          Write-Host "[ok] /api/skills returned $($skills.skills.Count) skills -- config.env reached the daemon process"

          # -Stop / -Start also have to run in this same step -- same
          # process-teardown-between-steps reason as above.
          & "${{ github.workspace }}\deploy\host\install.ps1" -Stop
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Stop exited $LASTEXITCODE" }
          if (Get-Process -Id $daemonPid -ErrorAction SilentlyContinue) { throw "-Stop did not stop pid $daemonPid" }
          Write-Host "[ok] -Stop stopped pid $daemonPid"

          & "${{ github.workspace }}\deploy\host\install.ps1" -Start
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Start exited $LASTEXITCODE" }
          if (-not (Test-Path $pidFile)) { throw "missing $pidFile after -Start" }
          $newPid = (Get-Content $pidFile -Raw).Trim()
          $newProc = Get-Process -Id $newPid -ErrorAction SilentlyContinue
          if (-not $newProc) { throw "-Start left no running process (pid $newPid)" }
          $health2 = Invoke-RestMethod -Uri "http://127.0.0.1:7456/api/health" -TimeoutSec 5
          Write-Host "[ok] -Start restarted the daemon (pid $newPid), health: $($health2 | ConvertTo-Json -Compress)"

      - name: Test install.ps1 -Uninstall
        shell: pwsh
        run: |
          & "${{ github.workspace }}\deploy\host\install.ps1" -Uninstall -Force -DeleteData
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall exited $LASTEXITCODE" }
          $odHome = Join-Path $env:USERPROFILE ".open-design"
          if (Test-Path $odHome) { throw "$odHome still exists after -Uninstall" }
          $task = Get-ScheduledTask -TaskName "OpenDesignDaemon" -ErrorAction SilentlyContinue
          if ($task) { throw "OpenDesignDaemon scheduled task still exists after -Uninstall" }
          Write-Host "[ok] -Uninstall removed $odHome and the scheduled task"

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          # try/catch, not `2>$null` alone -- pwsh 7's
          # $PSNativeCommandUseErrorActionPreference turns a native command's
          # non-zero exit (schtasks /Delete on a task that was never created,
          # e.g. an earlier step failed first) into a terminating error even
          # with stderr redirected.
          $odHome = Join-Path $env:USERPROFILE ".open-design"
          $pidFile = Join-Path $odHome "open-design.pid"
          if (Test-Path $pidFile) {
            $daemonPid = (Get-Content $pidFile -Raw -ErrorAction SilentlyContinue)
            if ($daemonPid) {
              $daemonPid = $daemonPid.Trim()
              try { Stop-Process -Id $daemonPid -Force -ErrorAction Stop } catch { try { taskkill.exe /PID $daemonPid /T /F 2>$null } catch {} }
            }
          }
          try { schtasks /Delete /TN "OpenDesignDaemon" /F 2>$null } catch {}
          Remove-Item -Recurse -Force "$odHome" -ErrorAction SilentlyContinue

          # schtasks above almost always "fails" here (the task is already
          # gone -- -Uninstall itself deletes it, or it was never created).
          # try/catch only stops a thrown exception; it does NOT clear
          # $LASTEXITCODE, which a native .exe's non-zero exit still sets --
          # and a pwsh Actions step fails on a trailing non-zero
          # $LASTEXITCODE even with no exception raised. This step is
          # unconditional best-effort teardown and must never fail the job.
          $global:LASTEXITCODE = 0

  publish:
    name: Publish GitHub Release
    needs: build
    # Manual workflow_dispatch runs (used to smoke-test a branch before it's
    # merged/tagged) build + smoke-test only -- they must never cut a real
    # public GitHub Release out of unmerged/experimental code. Only the tag
    # push and `preview` branch push triggers actually publish.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download all platform tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: host-runtime-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=host-runtime-v${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Merges every platform's tarball + .sha256 sidecar into one flat-key
      # release.json (top-level "<platform>.url" / "<platform>.sha256" keys —
      # see scripts/host-runtime/build-release-manifest.ts for why the shape
      # is flat: deploy/host/install.sh greps it before Node.js is guaranteed
      # to exist on the target host).
      - name: Build merged release.json
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          node --experimental-strip-types "${GITHUB_WORKSPACE}/scripts/host-runtime/build-release-manifest.ts" \
            --version "${{ needs.build.outputs.version }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out release.json
          cat release.json

      # No secrets are ever baked into the tarball (build-runtime.sh only
      # invokes pnpm build/deploy with no MEDIA_*/IDENTITY_URL/SESSION_SECRET
      # in its env) — install.sh collects those at install time via flags,
      # --env-file, or leaves them blank (KG sync stays off until configured).
      - name: Create or update the GitHub Release
        working-directory: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --clobber \
              *.tar.gz *.tar.gz.sha256 release.json
          else
            gh release create "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" \
              --title "Open Design host runtime ${{ needs.build.outputs.version }}" \
              --notes "Host runtime (daemon + static web export, no Docker/Electron) for darwin-arm64, darwin-x64, linux-x64. Install with: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.tag.outputs.tag }}/deploy/host/install.sh -o install.sh && bash install.sh" \
              *.tar.gz *.tar.gz.sha256 release.json
          fi
