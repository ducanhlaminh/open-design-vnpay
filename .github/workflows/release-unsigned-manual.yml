name: release-unsigned-manual

# WP5 (web-first migration): this workflow used to also build+sign(unsigned)
# +publish mac (arm64 + intel) DMGs and a windows portable zip on real
# GitHub-hosted runners (macos-14, macos-15-intel, windows-latest), via
# `@open-design/desktop` (Electron) + `tools-pack mac/win build`. Both are
# gone (apps/desktop, tools/pack/src/{mac,win}/**, mac/win resources — see
# the web-first migration change spec), so the `build_mac`, `build_mac_intel`,
# `build_win`, and `publish` jobs — and everything in `verify` that only
# existed to typecheck `@open-design/desktop` — were removed. What's left is
# the daemon+web typecheck/build verification gate, unchanged.
#
# Triggers automatically on push to `preview` (dedicated branch, separate
# from `main`, so routine commits don't burn CI time on every push).
# workflow_dispatch is kept for manual re-runs of the same verification gate.

on:
  push:
    branches: [preview]
  workflow_dispatch: {}

# Serialize runs: a newer push cancels an in-flight one.
concurrency:
  group: release-unsigned-manual
  cancel-in-progress: true

# Bake "Claude runs ONLY through the Docker sandbox" into every build. tools-pack
# reads these at packaging time and bakes them into the packaged config
# (sandboxDefault / sandboxSkills → forwarded to the daemon as
# OD_SANDBOX_DEFAULT / OD_SANDBOX_SKILLS), so a fresh install defaults to the
# sandbox owning all Claude runs and the host CLI is never used. Users can still
# turn it off in Settings → Sandbox.
env:
  # Required for Google session → shared-project identity reconciliation.
  OD_SANDBOX_DEFAULT: "1"
  OD_SANDBOX_SKILLS: "*"

jobs:
  verify:
    name: Verify (typecheck + guard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/daemon and packages/figma-h2d aren't in postinstall.mjs's
      # buildTargets; typecheck fails without their dist/*.d.ts (apps/web
      # imports @open-design/figma-h2d directly).
      - name: Build daemon, figma-h2d (typecheck dependencies)
        run: |
          pnpm --filter @open-design/daemon build
          pnpm --filter @open-design/figma-h2d build

      - name: Build web
        run: |
          pnpm --filter @open-design/web build
          pnpm --filter @open-design/web build:sidecar

      - name: Typecheck workspaces
        run: pnpm -r --workspace-concurrency=4 --if-present run typecheck

      - name: Check repository layout policies
        run: pnpm guard
