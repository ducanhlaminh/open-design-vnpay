<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: Arial, sans-serif; }
      #stage { width: 360px; padding: 16px; background: #f5f5f5; }
      .card {
        display: flex; flex-direction: column; gap: 8px;
        padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px;
      }
      .title { font-size: 18px; font-weight: 700; color: #111; }
      .body { font-size: 14px; color: #555; line-height: 20px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .pill { padding: 4px 10px; background: #2563eb; color: #fff; border-radius: 999px; font-size: 12px; }
      .rotated { transform: rotate(12deg); width: 80px; height: 40px; background: #f59e0b; }
      .badge::before { content: "★ "; color: gold; }
      svg { width: 24px; height: 24px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="card" id="root">
        <div class="title">Acme Dashboard</div>
        <div class="body">A longer paragraph that should wrap onto multiple lines inside this fixed-width card so we can verify line counting works.</div>
        <div class="row">
          <span class="pill">New</span>
          <span class="badge">Featured</span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#10b981" /></svg>
        </div>
        <div class="rotated">rot</div>
      </div>
    </div>
    <pre id="out">running…</pre>
    <script type="module">
      import { captureElement, toFigmaClipboardHtml } from "./harness.bundle.mjs";
      const out = document.getElementById("out");
      (async () => {
        try {
          const el = document.getElementById("root");
          const doc = await captureElement(el, { skipRemoteAssetSerialization: true });
          const payload = await toFigmaClipboardHtml([doc], { source: "harness" });

          // sanity checks
          const checks = [];
          const bcr = el.getBoundingClientRect();
          checks.push(["root.tag", doc.root.tag, "DIV"]);
          checks.push(["root.rect.width≈bcr", Math.round(doc.root.rect.width), Math.round(bcr.width)]);
          const findText = (n, acc=[]) => {
            if (n.nodeType === 3) acc.push(n);
            (n.childNodes||[]).forEach(c => findText(c, acc));
            return acc;
          };
          const texts = findText(doc.root);
          const para = texts.find(t => t.text.includes("longer paragraph"));
          checks.push(["paragraph found", !!para, true]);
          checks.push(["paragraph lineCount>1", para ? para.lineCount > 1 : false, true]);
          const findByTag = (n, tag) => {
            if (n.tag === tag) return n;
            for (const c of n.childNodes||[]) { const r = findByTag(c, tag); if (r) return r; }
            return null;
          };
          const svg = findByTag(doc.root, "SVG");
          checks.push(["svg content baked", !!(svg && svg.content && svg.content.includes("<svg")), true]);
          // rotated element should produce a quad
          const findRotated = (n) => {
            if (n.styles && n.styles.transform && n.styles.transform !== "none") return n;
            for (const c of n.childNodes||[]) { const r = findRotated(c); if (r) return r; }
            return null;
          };
          const rot = findRotated(doc.root);
          checks.push(["rotated has quad", !!(rot && rot.rect.quad), true]);
          // badge ::before pseudo
          const findPseudo = (n) => {
            if (n.pseudoElementNodes && n.pseudoElementNodes.before) return n;
            for (const c of n.childNodes||[]) { const r = findPseudo(c); if (r) return r; }
            return null;
          };
          checks.push(["::before captured", !!findPseudo(doc.root), true]);
          checks.push(["fonts collected", Object.keys(doc.fonts).length > 0, true]);
          checks.push(["payload has figh2d", payload.html.includes("(figh2d)"), true]);
          checks.push(["payload has figmeta", payload.html.includes("(figmeta)"), true]);

          const pass = checks.every(([, a, b]) => JSON.stringify(a) === JSON.stringify(b));
          out.textContent = JSON.stringify({
            PASS: pass,
            checks: checks.map(([k, a, b]) => `${pass||JSON.stringify(a)===JSON.stringify(b)?'ok':'FAIL'} ${k}: got=${JSON.stringify(a)} want=${JSON.stringify(b)}`),
            sampleNodeCount: texts.length,
            docKeys: Object.keys(doc),
          }, null, 2);
          window.__H2D_RESULT = { pass, doc, payloadLen: payload.html.length };
        } catch (e) {
          out.textContent = "ERROR: " + (e && e.stack || e);
          window.__H2D_RESULT = { pass: false, error: String(e && e.stack || e) };
        }
      })();
    </script>
  </body>
</html>
